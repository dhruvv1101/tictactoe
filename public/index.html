<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tic-Tac-Toe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* Violet Dusk palette */
  :root {
    --plum: #502D55;
    --berry: #935073;
    --peach: #F6DBC0;
    --cream: #F8F4E9;
    --night: #1d1126;
    --panel: rgba(248, 244, 233, 0.07);
    --edge: rgba(248, 244, 233, 0.22);
    --muted: rgba(248, 244, 233, 0.7);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background:
      radial-gradient(ellipse at 30% 0%, rgba(147, 80, 115, 0.35), transparent 55%),
      radial-gradient(ellipse at 90% 80%, rgba(80, 45, 85, 0.6), transparent 60%),
      var(--night);
    background-attachment: fixed;
    color: var(--cream);
    font-family: "Rubik", "Segoe UI", system-ui, sans-serif;
    display: flex;
    justify-content: center;
    padding: 28px 16px;
  }
  main { width: 100%; max-width: 420px; }
  h1 { font-size: 2rem; font-weight: 700; margin: 0 0 20px; text-align: center; }

  .row { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
  .row > .name { color: var(--muted); font-size: 0.9rem; min-width: 74px; }
  .seg {
    display: inline-flex; background: var(--panel); border: 1px solid var(--edge);
    border-radius: 999px; padding: 3px; gap: 2px;
  }
  .seg button {
    background: transparent; color: var(--muted); border: 0; border-radius: 999px;
    padding: 7px 16px; font: inherit; font-size: 0.9rem; cursor: pointer;
  }
  .seg button[aria-pressed="true"] { background: var(--peach); color: var(--plum); font-weight: 500; }

  .score { display: flex; gap: 8px; margin: 18px 0 14px; }
  .score div {
    flex: 1; background: var(--panel); border: 1px solid var(--edge);
    border-radius: 14px; padding: 8px 6px; text-align: center;
  }
  .score b { display: block; font-size: 1.5rem; font-weight: 700; }
  .score span { color: var(--muted); font-size: 0.78rem; }

  #status { min-height: 1.6em; margin: 0 0 12px; font-size: 1.1rem; text-align: center; }

  #board { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 18px; }
  .cell {
    aspect-ratio: 1; background: var(--cream); border: 2px solid transparent;
    border-radius: 16px; font: inherit; font-size: clamp(2.4rem, 14vw, 4rem); font-weight: 700;
    cursor: pointer; position: relative; color: var(--plum);
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.3);
  }
  .cell.x { color: var(--plum); }
  .cell.o { color: var(--berry); }
  .cell:hover:not(:disabled):not(.x):not(.o) { background: var(--peach); }
  .cell:disabled { cursor: default; }
  .cell.win { background: var(--peach); border-color: var(--plum); }
  .cell.hint { box-shadow: 0 0 0 4px var(--peach), 0 0 22px rgba(246, 219, 192, 0.55); }
  .cell.hint::after {
    content: attr(data-ghost); position: absolute; inset: 0; display: grid; place-items: center;
    opacity: 0.35;
  }
  .cell.hint[data-ghost="X"]::after { color: var(--plum); }
  .cell.hint[data-ghost="O"]::after { color: var(--berry); }

  .actions { display: flex; gap: 10px; }
  .actions button {
    flex: 1; padding: 13px; font: inherit; font-weight: 500; border-radius: 999px; cursor: pointer;
  }
  #hintBtn { background: var(--peach); color: var(--plum); border: 0; }
  #newBtn { background: transparent; color: var(--cream); border: 1px solid var(--edge); }
  .actions button:disabled { opacity: 0.4; cursor: not-allowed; }
  button:focus-visible { outline: 3px solid var(--peach); outline-offset: 2px; }
  @media (prefers-reduced-motion: no-preference) {
    .cell { transition: background 0.15s, box-shadow 0.15s; }
  }
</style>
</head>
<body>
<main>
  <h1>Tic-Tac-Toe</h1>

  <div class="row">
    <span class="name">Mode</span>
    <div class="seg" role="group" aria-label="Game mode">
      <button id="modeAI" aria-pressed="true">Vs AI</button>
      <button id="modeTwo" aria-pressed="false">Two players</button>
    </div>
  </div>

  <div class="row" id="pickRow">
    <span class="name">You play</span>
    <div class="seg" role="group" aria-label="Choose your mark">
      <button id="pickX" aria-pressed="true">X</button>
      <button id="pickO" aria-pressed="false">O</button>
      <button id="pickR" aria-pressed="false">Random</button>
    </div>
  </div>

  <div class="score">
    <div><b id="sx">0</b><span id="lx">X wins</span></div>
    <div><b id="sd">0</b><span>Draws</span></div>
    <div><b id="so">0</b><span id="lo">O wins</span></div>
  </div>

  <p id="status" aria-live="polite"></p>
  <div id="board" role="grid" aria-label="Tic-tac-toe board"></div>

  <div class="actions">
    <button id="hintBtn">Hint</button>
    <button id="newBtn">New game</button>
  </div>
</main>

<script>
const LINES = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];

let board, turn, over, hintCell = null;
let mode = "ai";      // "ai" | "two"
let choice = "X";     // "X" | "O" | "R" (what the human picked)
let aiMark = "O";     // resolved at the start of every game
const score = { X: 0, O: 0, D: 0 };

const $ = (id) => document.getElementById(id);
const boardEl = $("board");

/* ---------- game engine (minimax) ---------- */
function findWinner(b) {
  for (const [a, c, d] of LINES) {
    if (b[a] && b[a] === b[c] && b[a] === b[d]) return { mark: b[a], line: [a, c, d] };
  }
  return null;
}

// Score from the point of view of `me`. Faster wins and slower losses score higher.
function minimax(b, toMove, me, depth) {
  const w = findWinner(b);
  if (w) return w.mark === me ? 10 - depth : depth - 10;
  if (b.every(Boolean)) return 0;
  const other = toMove === "X" ? "O" : "X";
  let best = toMove === me ? -Infinity : Infinity;
  for (let i = 0; i < 9; i++) {
    if (b[i]) continue;
    b[i] = toMove;
    const s = minimax(b, other, me, depth + 1);
    b[i] = null;
    best = toMove === me ? Math.max(best, s) : Math.min(best, s);
  }
  return best;
}

function bestMove(b, player) {
  const other = player === "X" ? "O" : "X";
  let bestScore = -Infinity, move = null;
  for (let i = 0; i < 9; i++) {
    if (b[i]) continue;
    b[i] = player;
    const s = minimax(b, other, player, 1);
    b[i] = null;
    if (s > bestScore) { bestScore = s; move = i; }
  }
  return move;
}

/* ---------- UI ---------- */
function buildBoard() {
  boardEl.innerHTML = "";
  for (let i = 0; i < 9; i++) {
    const c = document.createElement("button");
    c.className = "cell";
    c.setAttribute("aria-label", "Cell " + (i + 1));
    c.addEventListener("click", () => humanMove(i));
    boardEl.appendChild(c);
  }
}

function isAITurn() { return mode === "ai" && !over && turn === aiMark; }

function label(mark) {
  if (mode === "two") return "Player " + mark;
  return mark === aiMark ? "AI (" + mark + ")" : "You (" + mark + ")";
}

function render() {
  const w = findWinner(board);
  [...boardEl.children].forEach((c, i) => {
    c.textContent = board[i] || "";
    c.className = "cell" + (board[i] ? " " + board[i].toLowerCase() : "")
      + (w && w.line.includes(i) ? " win" : "")
      + (hintCell === i ? " hint" : "");
    if (hintCell === i) c.dataset.ghost = turn; else delete c.dataset.ghost;
    c.disabled = over || !!board[i] || isAITurn();
  });

  if (w) $("status").textContent = label(w.mark) + " wins";
  else if (over) $("status").textContent = "It's a draw";
  else if (isAITurn()) $("status").textContent = "AI is thinking…";
  else $("status").textContent = label(turn) + " to move";

  $("hintBtn").disabled = over || isAITurn();
  $("sx").textContent = score.X;
  $("so").textContent = score.O;
  $("sd").textContent = score.D;
  $("lx").textContent = mode === "ai" ? (aiMark === "X" ? "AI (X)" : "You (X)") : "Player X";
  $("lo").textContent = mode === "ai" ? (aiMark === "O" ? "AI (O)" : "You (O)") : "Player O";
}

function place(i) {
  board[i] = turn;
  hintCell = null;
  const w = findWinner(board);
  if (w) { over = true; score[w.mark]++; }
  else if (board.every(Boolean)) { over = true; score.D++; }
  else turn = turn === "X" ? "O" : "X";
  render();
  if (isAITurn()) setTimeout(aiMove, 350);
}

function humanMove(i) {
  if (over || board[i] || isAITurn()) return;
  place(i);
}

function aiMove() {
  if (!isAITurn()) return;
  place(bestMove(board, aiMark));
}

function showHint() {
  if (over || isAITurn()) return;
  hintCell = bestMove(board, turn);
  render();
  $("status").textContent = label(turn) + " to move. Best move: cell " + (hintCell + 1);
}

function newGame() {
  board = Array(9).fill(null);
  turn = "X";               // X always moves first
  over = false;
  hintCell = null;
  const human = choice === "R" ? (Math.random() < 0.5 ? "X" : "O") : choice;
  aiMark = human === "X" ? "O" : "X";
  render();
  if (mode === "ai" && choice === "R") {
    $("status").textContent = "You are " + human + ". " + $("status").textContent;
  }
  if (isAITurn()) setTimeout(aiMove, 350);
}

function setMode(m) {
  mode = m;
  $("modeAI").setAttribute("aria-pressed", m === "ai");
  $("modeTwo").setAttribute("aria-pressed", m === "two");
  $("pickRow").style.display = m === "ai" ? "" : "none";
  score.X = score.O = score.D = 0;
  newGame();
}

function setChoice(c) {
  choice = c;
  $("pickX").setAttribute("aria-pressed", c === "X");
  $("pickO").setAttribute("aria-pressed", c === "O");
  $("pickR").setAttribute("aria-pressed", c === "R");
  score.X = score.O = score.D = 0;
  newGame();
}

$("modeAI").addEventListener("click", () => setMode("ai"));
$("modeTwo").addEventListener("click", () => setMode("two"));
$("pickX").addEventListener("click", () => setChoice("X"));
$("pickO").addEventListener("click", () => setChoice("O"));
$("pickR").addEventListener("click", () => setChoice("R"));
$("hintBtn").addEventListener("click", showHint);
$("newBtn").addEventListener("click", newGame);

buildBoard();
setMode("ai");
</script>
</body>
</html>
