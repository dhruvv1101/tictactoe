<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unbeatable Tic-Tac-Toe</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--ink:#1d1d1b;--mut:#6b6a63;--line:#d9d6cc;--x:#d9480f;--o:#1971c2;--win:#fff3bf}
@media(prefers-color-scheme:dark){:root{--bg:#161615;--card:#222220;--ink:#f1efe8;--mut:#a09e94;--line:#3a3935;--x:#ff922b;--o:#74c0fc;--win:#4a4020}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:16px system-ui,sans-serif}
main{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px;width:min(92vw,380px);text-align:center}
h1{font-size:1.3rem;margin:0 0 4px}p{color:var(--mut);margin:4px 0 16px}
.row{display:flex;gap:8px;justify-content:center}
button{font:inherit;cursor:pointer;color:var(--ink)}
.pick{flex:1;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.pick:hover{border-color:var(--ink)}
#board{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}
.cell{aspect-ratio:1;font-size:2.6rem;font-weight:700;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.cell.win{background:var(--win)}.X{color:var(--x)}.O{color:var(--o)}
#status{min-height:1.5em;font-weight:600}
.hidden{display:none}
</style></head><body><main>
<h1>Unbeatable Tic-Tac-Toe</h1>
<p>Python minimax + alpha-beta. Best you can do is draw.</p>
<section id="setup"><p>Choose your side (X moves first)</p>
<div class="row"><button class="pick" data-s="X">Play X</button><button class="pick" data-s="O">Play O</button><button class="pick" data-s="R">Random</button></div></section>
<section id="game" class="hidden">
<div id="status"></div><div id="board"></div>
<button class="pick" id="again" style="width:100%">New game</button></section>
</main>
<script>
const LINES=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
const ORDER=[4,0,2,6,8,1,3,5,7];
let board,human,ai,turn,over;
const $=id=>document.getElementById(id);

function winner(b){for(const l of LINES){const[a,c,d]=l;if(b[a]!==" "&&b[a]===b[c]&&b[c]===b[d])return{w:b[a],line:l}}return null}

// JS mirror of the Python engine, used only if /api/move is unreachable (e.g. opened locally).
function ab(b,p,me,d,al,be){
  const r=winner(b);if(r)return r.w===me?10-d:d-10;
  if(!b.includes(" "))return 0;
  const o=p==="X"?"O":"X";
  if(p===me){let best=-100;for(const m of ORDER)if(b[m]===" "){b[m]=p;best=Math.max(best,ab(b,o,me,d+1,al,be));b[m]=" ";al=Math.max(al,best);if(al>=be)break}return best}
  let best=100;for(const m of ORDER)if(b[m]===" "){b[m]=p;best=Math.min(best,ab(b,o,me,d+1,al,be));b[m]=" ";be=Math.min(be,best);if(al>=be)break}return best}
function localMove(b,me){
  if(b.every(c=>c===" "))return [0,2,4,6,8][Math.floor(Math.random()*5)];
  const o=me==="X"?"O":"X";let bs=-100,bi=null;
  for(const m of ORDER)if(b[m]===" "){b[m]=me;const s=ab(b,o,me,1,-100,100);b[m]=" ";if(s>bs){bs=s;bi=m}}return bi}

async function aiMove(){
  try{
    const r=await fetch("/api/move",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({board,ai})});
    if(!r.ok)throw 0;return (await r.json()).move;
  }catch(e){return localMove([...board],ai)}
}

function render(line){
  $("board").innerHTML="";
  board.forEach((c,i)=>{const b=document.createElement("button");
    b.className="cell "+c+(line&&line.includes(i)?" win":"");b.textContent=c.trim();
    b.disabled=over||c!==" "||turn!==human;b.onclick=()=>play(i);$("board").appendChild(b)});
}
function finish(){
  const r=winner(board);
  if(r){over=true;$("status").textContent=r.w===human?"You win!":"AI wins!";render(r.line);return true}
  if(!board.includes(" ")){over=true;$("status").textContent="Draw!";render();return true}
  return false}
async function play(i){
  board[i]=human;turn=ai;render();if(finish())return;
  $("status").textContent="AI is thinking…";
  const m=await aiMove();board[m]=ai;turn=human;
  if(!finish()){$("status").textContent="Your turn ("+human+")";render()}}
async function start(side){
  human=side==="R"?(Math.random()<.5?"X":"O"):side;ai=human==="X"?"O":"X";
  board=Array(9).fill(" ");over=false;turn="X";
  $("setup").classList.add("hidden");$("game").classList.remove("hidden");
  $("status").textContent="You are "+human;render();
  if(ai==="X"){$("status").textContent="AI is thinking…";const m=await aiMove();board[m]="X";turn=human;$("status").textContent="You are O. Your turn";render()}
  else $("status").textContent="You are X. Your turn"}
document.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>start(b.dataset.s));
$("again").onclick=()=>{$("game").classList.add("hidden");$("setup").classList.remove("hidden")};
</script></body></html>
